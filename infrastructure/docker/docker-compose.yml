services:
  postgres:
    image: postgres:16-alpine
    container_name: luxury-postgres
    environment:
      POSTGRES_DB: luxury_enterprises
      POSTGRES_USER: luxury
      POSTGRES_PASSWORD: luxury_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxury -d luxury_enterprises"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luxury-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
